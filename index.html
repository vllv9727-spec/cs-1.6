<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Half-Life Browser</title>
<style>
  body{margin:0;background:#000;overflow:hidden;color:#fff;font-family:monospace}
  #game{width:100vw;height:100vh;display:block}
  #ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,0.9);z-index:10;text-align:center}
  h1{color:#ffcc00;font-size:42px}
  p{color:#aaa;margin-bottom:20px}
  button{background:#4caf50;color:#fff;border:none;padding:15px 40px;font-size:20px;cursor:pointer}
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="ui">
  <h1>HALF-LIFE</h1>
  <p>Запуск через WebXash...</p>
  <button id="startBtn">Играть</button>
</div>

<script type="module">
  // 1. Перенаправляем на готовый рабочий фронтенд WebXash
  // Он уже содержит все WASM-модули и запускает демо-версию Half-Life (Uplink)
  document.getElementById('startBtn').onclick = () => {
    window.location.href = 'https://x8bitrain.github.io/webXash/';
  };
</script>
</body>
</html>
