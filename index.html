<!-- language: HTML, file: cs16.html, target: браузер с WebAssembly + WebGL2 -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>CS 1.6 Browser — Single File</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;overflow:hidden;font-family:monospace}
  #canvas{width:100vw;height:100vh;display:block;background:#111}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;
           justify-content:center;align-items:center;background:#000c;
           color:#fff;z-index:10;text-align:center;padding:20px}
  #overlay.hidden{display:none}
  h1{color:#ffcc00;font-size:32px;margin-bottom:16px;text-shadow:2px 2px 0 #000}
  p{color:#aaa;font-size:14px;max-width:600px;margin-bottom:20px;line-height:1.5}
  input{background:#222;border:1px solid #444;color:#fff;padding:10px;
        font-family:monospace;font-size:16px;width:400px;margin-bottom:10px}
  input:focus{outline:none;border-color:#4caf50}
  button{background:#4caf50;color:#fff;border:none;padding:12px 32px;
         font-family:monospace;font-size:18px;font-weight:bold;cursor:pointer;
         box-shadow:0 4px 0 #2e7d32}
  button:hover{background:#45a049}
  button:active{transform:translateY(4px);box-shadow:none}
  #status{color:#ff9800;margin-top:16px;font-size:14px}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="overlay">
  <h1>COUNTER-STRIKE 1.6</h1>
  <p>Выбери папку с твоей копией CS 1.6 (внутри должны быть папки <b>valve</b> и <b>cstrike</b>)
     или ZIP-архив с ними. Файлы читаются локально, никуда не загружаются.</p>
  <input type="file" id="fileInput" webkitdirectory directory multiple style="display:none">
  <button id="pickBtn">Выбрать папку с игрой</button>
  <div id="status">Ожидание файлов...</div>
</div>

<script type="module">
// Движок и SDK CS 1.6 грузим с CDN
import { Xash3D } from 'https://cdn.jsdelivr.net/npm/xash3d-fwgs@1.2.2/+esm';
import clientWasm from 'https://cdn.jsdelivr.net/npm/cs16-client@0.1.2/cl_dlls/client_emscripten_wasm32.wasm';
import menuWasm   from 'https://cdn.jsdelivr.net/npm/cs16-client@0.1.2/cl_dlls/menu_emscripten_wasm32.wasm';
import serverWasm from 'https://cdn.jsdelivr.net/npm/cs16-client@0.1.2/dlls/cs_emscripten_wasm32.wasm';
import extrasPk3  from 'https://cdn.jsdelivr.net/npm/cs16-client@0.1.2/extras.pk3';

const canvas = document.getElementById('canvas');
const overlay = document.getElementById('overlay');
const statusEl = document.getElementById('status');
const fileInput = document.getElementById('fileInput');

let engine = null;

document.getElementById('pickBtn').addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async (e) => {
  const files = e.target.files;
  if (!files.length) return;

  statusEl.textContent = 'Подготовка файлов игры...';

  // Собираем виртуальную файловую систему из выбранных файлов
  const vfs = {};
  for (const f of files) {
    const path = f.webkitRelativePath.split('/').slice(1).join('/');
    if (!path) continue;
    if (path.startsWith('cstrike/') || path.startsWith('valve/')) {
      vfs[path] = new Uint8Array(await f.arrayBuffer());
    }
  }

  if (Object.keys(vfs).length === 0) {
    statusEl.textContent = 'Ошибка: в выбранной папке нет cstrike/ или valve/';
    return;
  }

  statusEl.textContent = 'Загрузка WASM-движка...';

  engine = new Xash3D({
    canvas,
    arguments: ['-game', 'cstrike', '+map', 'de_dust2'],
    libraries: {
      menu: menuWasm,
      client: clientWasm,
      server: serverWasm,
    },
    filesystem: vfs, // монтируем файлы игры
  });

  await engine.init();
  engine.main();

  // Добавляем extras.pk3 (боты, дополнительные ресурсы)
  try {
    const resp = await fetch(extrasPk3);
    const buf = new Uint8Array(await resp.arrayBuffer());
    engine.FS.writeFile('/cstrike/extras.pk3', buf);
  } catch (_) {}

  overlay.classList.add('hidden');
  canvas.focus();
});
</script>
</body>
</html>
